# Replication alerting rules for hopper's logical-replication topology.
#
# EVALUATED IN GRAFANA CLOUD (Mimir), not on a replica — so a dead replica
# still pages. This is the whole reason the metrics are pushed out: on
# 2026-06-27 galadriel's postgres was down 2.5h; host-local alerting would have
# died with it. Load with mimirtool:
#
#   mimirtool rules load scripts/monitoring/replication-alerts.yml \
#     --address="$GC_PROM_URL_BASE" --id="$GC_TENANT" --key="$GC_TOKEN"
#
# Metrics come from Alloy's embedded postgres_exporter on the PUBLISHER
# (job="postgres-publisher"), custom query "hopper_replication_slot"
# (scripts/monitoring/queries.yaml). The slot view shows a sick replica even
# when its own host is unreachable, so publisher-side scraping alone covers
# every incident this topology has actually had.
#
# Backstop context: publisher max_slot_wal_keep_size = 1200GB (was 1500GB in
# earlier notes); WAL burn ~35-40 GB/h. A slot that crosses the backstop is
# invalidated ("lost") and its replica needs a full rebuild, so the lag pages
# fire with hours of runway left.

groups:
  - name: hopper-replication
    rules:
      # The exporter itself stopped reporting — replication is now unmonitored.
      # (Also fires if the publisher's postgres is down, since the local DSN
      # scrape fails.)
      - alert: PostgresPublisherExporterDown
        expr: up{job="postgres-publisher"} == 0
        for: 5m
        labels: { severity: page }
        annotations:
          runbook_url: "https://github.com/atomdrift-project/hopper/blob/main/scripts/monitoring/RUNBOOK.md#what-pages-you-and-why"
          summary: "Postgres replication exporter is down"
          description: "Alloy/postgres_exporter on the publisher has been unscrapeable for 5m — replication lag is no longer being observed."

      # A slot crossed max_slot_wal_keep_size and self-invalidated. Unrecoverable
      # without a full rebuild (the 2026-06-21 incident). Any kind, page now.
      - alert: ReplicaSlotInvalidated
        expr: hopper_replication_slot_wal_status_code == 3
        for: 0m
        labels: { severity: page }
        annotations:
          runbook_url: "https://github.com/atomdrift-project/hopper/blob/main/scripts/replica/RUNBOOK.md#fast-rebuild-deferred-index-bulk-copy"
          summary: "Replication slot {{ $labels.slot_name }} is LOST"
          description: "wal_status=lost on {{ $labels.slot_name }} ({{ $labels.kind }}) — exceeded max_slot_wal_keep_size and was invalidated. The replica needs a full rebuild (make rebuild-replica)." # yamllint disable-line rule:line-length

      # A streaming replica's apply worker is no longer consuming its slot:
      # host/PG down (2026-06-27), subscription disabled by schema drift
      # (2026-06-14/21), or a severed link. Tablesync slots are excluded — they
      # are legitimately inactive during the initial COPY.
      - alert: ReplicaSlotInactive
        expr: hopper_replication_slot_active{kind="streaming"} == 0
        for: 10m
        labels: { severity: page }
        annotations:
          runbook_url: "https://github.com/atomdrift-project/hopper/blob/main/scripts/monitoring/RUNBOOK.md#what-pages-you-and-why"
          summary: "Streaming replica slot {{ $labels.slot_name }} has no consumer"
          description: "No walsender has consumed {{ $labels.slot_name }} for 10m — the replica is disconnected (host/PG down or subscription disabled)."

      # Streaming replica falling behind. Warn early, well under the backstop.
      - alert: ReplicaSlotLagWarning
        expr: hopper_replication_slot_retained_wal_bytes{kind="streaming"} > 300e9
        for: 15m
        labels: { severity: warning }
        annotations:
          runbook_url: "https://github.com/atomdrift-project/hopper/blob/main/scripts/monitoring/RUNBOOK.md#what-pages-you-and-why"
          summary: "Replica slot {{ $labels.slot_name }} retaining >300GB WAL"
          description: "{{ $value | humanize1024 }}B pinned by {{ $labels.slot_name }} — the streaming replica is lagging (backstop 1500GB)."

      # Any slot within ~300GB of the 1200GB backstop. Page: if it crosses, the
      # slot is invalidated and the replica must be rebuilt.
      - alert: ReplicaSlotLagCritical
        expr: hopper_replication_slot_retained_wal_bytes > 900e9
        for: 5m
        labels: { severity: page }
        annotations:
          runbook_url: "https://github.com/atomdrift-project/hopper/blob/main/scripts/replica/RUNBOOK.md#fast-rebuild-deferred-index-bulk-copy"
          summary: "Replication slot {{ $labels.slot_name }} near the backstop"
          description: "{{ $value | humanize1024 }}B pinned by {{ $labels.slot_name }} ({{ $labels.kind }}) — within ~300GB of max_slot_wal_keep_size (1200GB). It will self-invalidate if it crosses." # yamllint disable-line rule:line-length

      - alert: PostgresWalOnDiskHigh
        expr: hopper_pg_stat_wal_bytes > 800e9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Publisher pg_wal is {{ $value | humanize1024 }}B on disk"
          description: "pg_ls_waldir sum is large — slots or archive/removal lagging."

      - alert: PostgresConnectionsHigh
        expr: hopper_pg_stat_connections / hopper_pg_stat_max_connections > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Publisher connections at {{ $value | humanizePercentage }} of max"
          description: "{{ $labels.job }} hopper backends nearing max_connections."

      # Statistics freshness. Added 2026-08-21 after bulkload.sh left
      # autovacuum=off on the replica for days: `samples` took ~14M
      # modifications with analyze_count=0, pg_class.reltuples froze, and
      # prism's corpus counter — which reads reltuples — sat at a number that
      # had stopped moving. Nothing errored; the only symptom was a statistic
      # that looked plausible and was wrong, which is why this needs an alert
      # rather than a dashboard panel someone might notice.
      - alert: TableNeverAnalyzed
        expr: hopper_pg_table_stats_never_analyzed == 1
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.table }} has never been ANALYZEd"
          description: >-
            No ANALYZE on record for {{ $labels.table }}. Query plans are being
            chosen from absent statistics and pg_class.reltuples is frozen, so
            anything reading it (prism's corpus counter) is reporting a stale
            number. Check `SHOW autovacuum` — bulkload.sh turns it off for the
            fast sync and a run killed without its EXIT trap leaves it off.

      - alert: TableAnalyzeStale
        expr: hopper_pg_table_stats_analyze_age_seconds > 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.table }} last analyzed {{ $value | humanizeDuration }} ago"
          description: >-
            Statistics older than 24h on a table taking continuous writes.
            reltuples drifts from the real row count and the planner works from
            stale selectivity estimates.

      - alert: AutovacuumDisabled
        expr: hopper_pg_table_stats_dead_tup > 5e6 and hopper_pg_table_stats_vacuum_age_seconds > 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.table }} has {{ $value }} dead tuples and no recent VACUUM"
          description: >-
            Dead tuples accumulating with no vacuum in 24h — bloat grows and,
            left long enough, anti-wraparound autovacuum becomes the only thing
            standing between this and a forced emergency vacuum.

      # An initial tablesync (e.g. .62's sample_locations copy) freezes its
      # slot's restart_lsn for the whole COPY, so retention only grows. Expected,
      # but warn so a slow copy doesn't silently march into the backstop.
      - alert: TablesyncSlotLagWarning
        expr: hopper_replication_slot_retained_wal_bytes{kind="tablesync"} > 400e9
        for: 30m
        labels: { severity: warning }
        annotations:
          runbook_url: "https://github.com/atomdrift-project/hopper/blob/main/scripts/monitoring/RUNBOOK.md#what-pages-you-and-why"
          summary: "Tablesync slot {{ $labels.slot_name }} retaining >400GB WAL"
          description: "An initial tablesync is pinning {{ $value | humanize1024 }}B and rising. Normal during a large copy; watch it against the 1500GB backstop." # yamllint disable-line rule:line-length

  # --- Subscriber-side ------------------------------------------------------
  # Fed by hopper/scripts/replica/replica-textfile.sh on each replica, via the
  # node_exporter textfile collector -> Alloy -> OTLP. These used to be blocked
  # on scraping each replica's postgres directly (galadriel listens socket-only,
  # and opening listen_addresses/pg_hba to the tailnet for it was not worth it);
  # a local emitter needs none of that.
  #
  # They earn their place because the publisher-side rules above only see a sick
  # subscriber INDIRECTLY, as slot lag. On 2026-08-20 a routine publisher restart
  # tripped disable_on_error on galadriel at 00:49 EDT and the subscription stayed
  # disabled for 5h22m; SubscriptionDisabled would have paged in two minutes.
  - name: hopper-replication-subscriber
    rules:
      # The emitter is the only source for every rule below it, so a dead emitter
      # silently disarms them. Page on staleness before trusting anything else.
      - alert: ReplicaMetricsStale
        expr: |
          (time() - node_textfile_mtime_seconds{file="hopper-replica.prom"}) > 900
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Replica health metrics stale on {{ $labels.host }}"
          description: "hopper-replica.prom has not been rewritten for {{ $value | humanizeDuration }} — the emitter timer, postgres, or the host is down, and every subscriber-side replication alert is now blind." # yamllint disable-line rule:line-length

      # disable_on_error=true means any apply error disables the subscription,
      # and replica-heal.sh deliberately refuses to re-enable a non-schema one.
      # Nothing then re-enables it until a human does.
      - alert: SubscriptionDisabled
        expr: hopper_replica_subscription_enabled == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Subscription {{ $labels.subscription }} is DISABLED"
          description: "The subscription on {{ $labels.host }} is disabled and will not re-enable itself. WAL now accumulates on the publisher against its slot. Re-enable with: ALTER SUBSCRIPTION {{ $labels.subscription }} ENABLE;" # yamllint disable-line rule:line-length

      - alert: SubscriptionApplyWorkerMissing
        expr: |
          hopper_replica_subscription_enabled == 1
          and hopper_replica_apply_worker_running == 0
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Subscription {{ $labels.subscription }} enabled but no apply worker"
          description: "Enabled for 10m with no apply worker attached on {{ $labels.host }} — the worker is crash-looping (a lost/invalidated slot does this every 5s) or max_logical_replication_workers is exhausted." # yamllint disable-line rule:line-length

      - alert: SubscriptionApplyErrors
        expr: increase(hopper_replica_apply_error_count[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Apply errors on {{ $labels.subscription }}"
          description: "{{ $value | printf \"%.0f\" }} apply error(s) in 15m on {{ $labels.host }}. With disable_on_error=true the next one can disable the subscription." # yamllint disable-line rule:line-length

      - alert: ReplicaTablesNotReady
        expr: |
          hopper_replica_tables_ready < hopper_replica_tables_total
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.subscription }} has tables not in 'ready' state"
          description: "{{ $value }} of {{ $labels.subscription }}'s tables are still copying/syncing after 6h on {{ $labels.host }} — a stuck tablesync holds its own slot and its own WAL." # yamllint disable-line rule:line-length

      # Index drift: the replica keeps a deliberately minimal index set
      # (scripts/replica/slim-indexes.sh). DDL does not replicate, so a
      # master-side index never arrives on its own — 'make replica' has to run.
      # This is what silently diverged to 14 indexes vs the master's 77.
      - alert: ReplicaIndexPolicyDrift
        expr: hopper_replica_index_policy_missing > 0
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "Replica {{ $labels.host }} is missing {{ $value }} policy index(es)"
          description: "{{ $value }} index(es) named by REPLICA_KEEP_INDEXES are absent — 'make replica' has not run since hopper gained them, so prism read paths are unindexed. Run 'make replica' on {{ $labels.host }}." # yamllint disable-line rule:line-length

      - alert: ReplicaIndexPolicyExtra
        expr: hopper_replica_index_policy_extra > 0
        for: 24h
        labels: { severity: warning }
        annotations:
          summary: "Replica {{ $labels.host }} carries {{ $value }} unslimmed index(es)"
          description: "{{ $value }} index(es) on subscribed tables are not in the keep list — on a logical replica every one is maintained per applied row. Run scripts/replica/slim-indexes.sh on {{ $labels.host }}." # yamllint disable-line rule:line-length
