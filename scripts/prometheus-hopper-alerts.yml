# Prometheus alerting rules for hopper.
#
# Hopper publishes its dashboard numerics at GET /_/metrik on the dashboard
# address (default :8081, flag -dashboard-addr). Point a Prometheus scrape at
# it; once a minute is plenty — the collector reuses the dashboard's 45s query
# caches, so a scrape adds no database load the page would not already cause.
#
#   scrape_configs:
#     - job_name: hopper
#       scrape_interval: 60s
#       static_configs:
#         - targets: ['hopper:8081']
#       metrics_path: /_/metrik
#
# Load this file from prometheus.yml (rule_files: [prometheus-hopper-alerts.yml]).
# The `job="hopper"` matchers below assume the job_name above; adjust if yours
# differs.
#
# Exported metric catalogue (OTel maps dots to underscores, appends unit
# suffixes, and adds _total to counters):
#
#   Queues / backlog (gauges):
#     hopper_queue_pending              samples awaiting first analysis
#     hopper_queue_rescan               samples eligible for re-analysis
#     hopper_queue_cleave_pending       samples awaiting the cleave stage
#     hopper_queue_litmus_pending       samples awaiting the litmus stage
#   Throughput:
#     hopper_analyzed_total             cumulative samples analyzed (DB + session)
#     hopper_analysis_rate_per_second   {tier="toplevel"|"rescan"} analyses/sec
#     hopper_files_rate_per_second      fleet files/sec over the trailing 15m
#   Freshness / lag (gauges, seconds):
#     hopper_workflow_added_age_seconds      since the newest added sample
#     hopper_workflow_analyzed_age_seconds   since the newest analyzed sample
#     hopper_workflow_ready_lag_seconds      newest-added to newest-prism-ready
#   Walk / ingest (per-process counters):
#     hopper_walk_files_total, hopper_walk_inserted_total,
#     hopper_walk_cache_hits_total, hopper_walk_filtered_total, hopper_errors_total
#   Insert failures by cause (per-process counter, subset of hopper_errors_total):
#     hopper_insert_failures_total{cause="lock_timeout"|"statement_timeout"|
#       "serialization"|"deadlock"|"constraint"|"data"|"connection"|"context"|"other"}
#   Per worker ({worker="<name:ip>"}):
#     hopper_worker_last_seen_age_seconds, hopper_worker_active_claims,
#     hopper_worker_slots, hopper_worker_queue, hopper_worker_rss_bytes,
#     hopper_worker_load1, hopper_worker_files_rate_per_second,
#     hopper_worker_analyzed_total, hopper_worker_errors_total,
#     hopper_worker_errors_recent
#   Local scan (litmus) worker:
#     hopper_local_worker_up            1 healthy, 0 down
#     hopper_local_worker_restarts_total  cumulative supervisor restarts
#
# Shared obs instrumentation (every atomdrift service exposes these — see the
# obs package). Labeled by job/instance, pool="<name>" for db_pool_*:
#   Database pool:
#     db_pool_open, db_pool_idle, db_pool_acquired, db_pool_max,
#     db_pool_constructing, db_pool_wait_count_total, db_pool_wait_duration_seconds_total,
#     db_pool_canceled_acquire_total, db_pool_new_conns_total
#   Process / runtime (Prometheus client collectors):
#     process_cpu_seconds_total, process_resident_memory_bytes, process_open_fds,
#     process_max_fds, go_goroutines, go_threads, go_memstats_heap_inuse_bytes,
#     go_gc_duration_seconds
#   HTTP server/client (otelhttp): http_server_request_duration_seconds_*,
#     http_client_request_duration_seconds_* (labeled by http_route, status)

groups:
  - name: hopper-liveness
    rules:
      # The process is up but the in-process scan (litmus) worker is down —
      # crashing, wedged, or failing to start. This is the published health the
      # dashboard's red banner uses, so a firing alert is enough to start
      # debugging. 10m rides out the supervisor's restart/backoff so a single
      # crash-and-recover does not page.
      - alert: HopperLocalWorkerDown
        expr: hopper_local_worker_up == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Hopper local scan worker is down"
          description: "hopper_local_worker_up has been 0 for 10m; the in-process litmus worker is not analyzing."

      # Hopper itself is unreachable (process down, dashboard port closed, host
      # gone). Distinct from the gauge above, which needs hopper up to report.
      #
      # Caveat (2026-07-09): this can stay green while hopper is dead to the
      # world. Prometheus scrapes over a persistent keep-alive connection, and
      # in the memory-pressure incident the accept loop starved — NEW
      # connections queued forever while established ones kept being served.
      # `up` only goes 0 if the scrape connection itself is torn down. For a
      # probe that exercises the accept path every time, point blackbox_exporter
      # (or any external HTTP checker that opens a fresh connection per probe)
      # at GET /healthz on the dashboard port and alert on that as well.
      - alert: HopperDown
        expr: up{job="hopper"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Hopper is not scrapeable"
          description: "Prometheus cannot scrape hopper ({{ $labels.instance }}) — process or dashboard endpoint down."

      # The local worker's kernel-reported memory (VmRSS+VmSwap, measured by
      # hopper from /proc — not the worker's own estimate) is past its budget.
      # The supervisor kills it at 1.25x sustained and the workers cgroup caps
      # it at 1.5x; alerting at 1x is the early warning that the worker's
      # self-throttle has already failed and the safety nets are next.
      - alert: HopperLocalWorkerOverBudget
        expr: hopper_local_worker_memory_bytes > hopper_local_worker_memory_budget_bytes
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Hopper local scan worker is over its memory budget"
          description: "Worker at {{ $value | humanize1024 }}B against its configured budget; supervisor kill imminent at 1.25x."

      # The supervisor is restarting the local worker repeatedly: it starts, dies,
      # restarts. up may read 1 between restarts, so watch the restart counter.
      - alert: HopperLocalWorkerFlapping
        expr: increase(hopper_local_worker_restarts_total[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Hopper local scan worker is flapping"
          description: "{{ $value | printf \"%.0f\" }} local-worker restarts in the last 15m."

      # A remote worker stopped checking in but has not yet aged out of the
      # tracker. Per-worker, so the label names the node. 10m is well past the
      # poll/heartbeat cadence.
      - alert: HopperWorkerStale
        expr: hopper_worker_last_seen_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hopper worker {{ $labels.worker }} is stale"
          description: "{{ $labels.worker }} last checked in {{ $value | printf \"%.0f\" }}s ago."

  - name: hopper-pipeline
    rules:
      # Nothing has been analyzed in an hour while work is queued: the pipeline
      # has stalled even though there is backlog to drain.
      - alert: HopperAnalysisStalled
        expr: hopper_workflow_analyzed_age_seconds > 3600 and hopper_queue_pending > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Hopper analysis has stalled"
          description: "No sample analyzed in {{ $value | printf \"%.0f\" }}s while the pending queue is non-empty."

      # Ingestion has stopped feeding the pipeline: no new sample added in an
      # hour. Trends a dead forager/walk upstream.
      - alert: HopperIngestionStalled
        expr: hopper_workflow_added_age_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Hopper ingestion has stalled"
          description: "No sample added in {{ $value | printf \"%.0f\" }}s; upstream ingestion may be down."

      # Inserts are failing on database lock contention. This is the silent mode
      # that took out ingestion on 2026-06-14: the walk backstop fails a whole
      # batch at once and drops it, so a sustained rate means samples are being
      # lost, not retried. added_age may still look fresh if the forager path is
      # also landing rows, so watch the failure rate directly.
      - alert: HopperInsertLockContention
        expr: sum(rate(hopper_insert_failures_total{cause="lock_timeout"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hopper inserts failing on lock contention"
          description: "{{ $value | printf \"%.2f\" }} samples/sec failing to insert on lock_timeout over 10m; check database lock waits."

      # The connection pool is running at its ceiling: queries are queuing for a
      # connection, the upstream condition for the lock/insert failures above.
      - alert: HopperDBPoolSaturated
        expr: db_pool_acquired{job="hopper"} / clamp_min(db_pool_max{job="hopper"}, 1) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hopper DB pool {{ $labels.pool }} is saturated"
          description: "pool {{ $labels.pool }} is {{ $value | humanizePercentage }} checked out for 10m; connections are queuing."

      # Callers are giving up (context timeout/cancel) while waiting for a pool
      # connection — a stronger contention signal than saturation alone.
      - alert: HopperDBPoolAcquireCanceled
        expr: sum by (pool) (rate(db_pool_canceled_acquire_total{job="hopper"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hopper DB pool {{ $labels.pool }} acquires being canceled"
          description: "{{ $value | printf \"%.2f\" }} acquire cancellations/sec on pool {{ $labels.pool }} over 10m; connections are not available in time."
